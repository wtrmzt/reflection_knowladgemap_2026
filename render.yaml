# render.yaml
services:
  - type: web
    name: knowledge-map-backend_2026
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-map-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # Renderダッシュボードから手動入力

  - type: web
    name: knowledge-map-frontend_2026
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: knowledge-map-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: knowledge-map-db_2026
    databaseName: knowledgemap
    user: admin
    plan: free
